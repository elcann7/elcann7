name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"      # hər gün gecə yarısı (UTC)
  workflow_dispatch:         # əl ilə işə salmaq üçün
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7E2A22&color_dots=#E4DBC5,#CDBE9A,#A8935F,#7B6A3E,#4A3F24
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A8453A&color_dots=#221E17,#4A3F2A,#7A6842,#A8905A,#CDB57A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
